# Example secrets for garage_door.yaml
#
# Copy this to secrets.yaml and fill in your own values:
#
#   cp secrets.example.yaml secrets.yaml
#
# secrets.yaml is listed in .gitignore. Never commit it.
#
# Every value below is a placeholder. Several must also match what you paste
# into the Android app's configuration - those are marked.

# --- WiFi -------------------------------------------------------------------
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# --- Network ----------------------------------------------------------------
# A static IP, so the app and browser always know where the device is. Pick an
# address outside your router's DHCP range so nothing else is handed it.
#
# device_ip must match LOCAL_IP in cert-config (the certificate is issued for
# this address) and the app's localUrl.
device_ip: "192.168.1.50"
network_gateway: "192.168.1.1"
network_dns: "192.168.1.1"

# --- Web interface login ----------------------------------------------------
# HTTP Basic Auth, sent over TLS. If you forward a port to this device, this is
# the only thing between the internet and your garage door - make the password
# long and random, e.g.:
#   openssl rand -base64 18
#
# Must match username / password in the app's configuration.
web_username: "admin"
web_password: "CHANGE_ME"

# --- Bluetooth trigger secret -----------------------------------------------
# The app writes this over Bluetooth to fire the relay; anything else is
# ignored. Generate your own:
#   openssl rand -hex 12
#
# This is a shared secret, not encryption - ESPHome's BLE server has no pairing.
# It stops anyone in range with a generic BLE app from opening your door.
#
# Must match the app's bluetooth.secret. Changing it means reflashing AND
# updating the app; Bluetooth won't work until both agree.
ble_secret: "CHANGE_ME"

# --- ESPHome API ------------------------------------------------------------
# Used by `esphome logs` over the network (and by Home Assistant, if you use
# it). Generate your own:
#   openssl rand -base64 32
api_encryption_key: "CHANGE_ME"
